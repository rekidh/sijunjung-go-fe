name: sijunjung_go_fe_customer
description: A Flutter project for the customer app

# Menambahkan SDK constraint di bagian atas file
environment:
  sdk: ">=3.7.0 <4.0.0"  # Tentukan versi SDK Dart yang digunakan

dependencies:
  flutter:
    sdk: flutter

  # Dependensi khusus customer
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  provider: ^6.0.3
  google_maps_flutter: ^2.1.1

  # Mengimpor kode bersama dari folder shared
  shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../shared/assets/images/logo/launcher-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "../shared/assets/images/logo/launcher-icon.png"
  adaptive_icon_foreground: "../shared/assets/images/logo/launcher-icon.png" 

flutter:
  uses-material-design: true
